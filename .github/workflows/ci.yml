name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  # ── The library: lint, format, diagrams, tests (100% coverage), build ──────
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Lint (eslint, --max-warnings=0)
        run: npm run lint
      - name: Lint styles (stylelint)
        run: npm run lint:styles
      - name: Format check (prettier)
        run: npm run format:check
      - name: Diagrams up to date (regenerated from their data)
        run: npm run diagrams:check
      - name: Unit tests + coverage (100% floor)
        run: npm run test:coverage
      - name: Build the package
        run: npm run build

  # ── Required check ───────────────────────────────────────────────────
  # The branch ruleset requires one check named `ci`; each job above reports under its own name,
  # so this gathers them into that one check — add a new job to `needs` and it is required too,
  # without touching the ruleset. `always()`: a required check that is SKIPPED counts as passing,
  # so this must run (and fail) even when a job it needs has failed or been cancelled.
  ci:
    name: ci
    if: always()
    needs: [library]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
